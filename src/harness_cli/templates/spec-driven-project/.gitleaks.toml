# Gitleaks configuration for MPHarness projects
# Extends the default Gitleaks rules (160+ detectors)
title = "MPHarness Gitleaks Configuration"

[allowlist]
description = "Standard allowlist for non-production documentation and templates"
paths = [
    '''(^|/)docs/''',
    '''(^|/)archive/''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)pnpm-lock\.yaml$''',
    '''(^|/)yarn\.lock$''',
    '''(^|/)uv\.lock$'''
]
