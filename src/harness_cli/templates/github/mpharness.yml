# Managed by MPHarness (__HARNESS_REF__). Regenerate with: harness update
# Runs the same governance checks as the local guards, on GitHub's servers,
# so nothing can skip them. Required status check name: "mpharness".
name: MPHarness

on:
  pull_request:
  push:
    branches: [__PROTECTED__]

permissions:
  contents: read

jobs:
  mpharness:
    name: mpharness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install MPHarness and Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install "git+https://github.com/mporrasor/MPHarness@__HARNESS_REF__"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v__GITLEAKS__/gitleaks___GITLEAKS___linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks

      - name: Verify governance
        run: harness verify --stage ci
