# ==================================================================
#  MPHarness · Reglas de gobierno del proyecto
#
#  Este archivo decide qué puede y qué no puede hacer la IA
#  (Claude Code, Antigravity) en este proyecto.
#  Para desactivar una regla cambia "true" por "false".
#  Después de editarlo ejecuta:  harness doctor
# ==================================================================
version: 1
language: es              # Idioma de los mensajes: es | en

project:
  repository: "__REPOSITORY__"   # Repositorio de GitHub (usuario/nombre)
  stage: __STAGE__               # new = proyecto nuevo · existing = código ya iniciado
  planner: __PLANNER__           # Cómo se planifica el trabajo:
                                 #   architect = The Architect (Claude Code): entrevista y plano completo
                                 #   speckit   = GitHub Spec Kit: recomendado para proyectos nuevos
                                 #   openspec  = OpenSpec: recomendado para código ya iniciado
                                 #   none      = sin herramienta externa

branches:
  protected: [main, master]      # Ramas donde nadie hace commits directos

rules:
  block_secrets_in_code: true        # Bloquea que la IA escriba contraseñas o claves dentro del código
  protect_secret_files: true         # Pregunta antes de que la IA lea o edite .env, llaves y certificados
  block_commits_to_protected: true   # La IA trabaja en ramas (feat/…, fix/…), nunca directo en main
  block_force_push: true             # Impide reescribir el historial con "git push --force"
  block_skipping_checks: true        # Impide saltarse los controles (--no-verify, core.hooksPath)
  ask_before_destructive: true       # Pregunta antes de borrar en masa, "git reset --hard", DROP TABLE…
  ask_before_remote_scripts: true    # Pregunta antes de ejecutar scripts de internet (curl … | sh)
  protect_governance_files: true     # Pregunta antes de que la IA cambie estas reglas o los workflows
  require_plan_approval: false       # Si es true, la IA no edita código hasta que ejecutes "harness approve"

custom:
  blocked_commands: []    # Comandos extra que la IA no puede ejecutar. Ejemplo:  ["docker system prune"]
  protected_paths: []     # Archivos o carpetas extra que requieren tu permiso. Ejemplo:  ["infra/*"]
