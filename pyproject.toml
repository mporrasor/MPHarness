[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-cli"
version = "0.1.0"
description = "A universal Spec-Driven Project Harness for AI Agents."
authors = [
    { name = "AI Assistant" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "mcp>=0.1.0"
]

[project.scripts]
harness = "harness_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
