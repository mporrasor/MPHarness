[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-cli"
version = "0.2.0"
description = "Guardrails for building secure apps with AI coding agents (Claude Code, Antigravity)."
authors = [
    { name = "mporrasor" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
mcp = ["mcp>=0.1.0"]

[project.scripts]
harness = "harness_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_cli = ["templates/*/*", "templates/*/.*"]

[project.urls]
Homepage = "https://github.com/mporrasor/MPHarness"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
